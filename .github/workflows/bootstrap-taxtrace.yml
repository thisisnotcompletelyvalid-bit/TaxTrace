name: Bootstrap TaxTrace source tree

on:
  push:
    paths:
      - 'bootstrap/**'
      - '.github/workflows/bootstrap-taxtrace.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify Phase 0-3 archive
        shell: bash
        run: |
          set -euo pipefail
          test -f bootstrap/part00.b64
          test -f bootstrap/part13.b64
          cat bootstrap/part*.b64 | base64 --decode > taxtrace-phases-0-3.zip
          echo 'd2faf36a64a82024ddf860cfbd07b917e3c2d0ec1db169819186c40c16dc0406  taxtrace-phases-0-3.zip' | sha256sum --check --strict
          unzip -tq taxtrace-phases-0-3.zip

      - name: Extract complete repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap-extract
          mkdir .bootstrap-extract
          unzip -q taxtrace-phases-0-3.zip -d .bootstrap-extract
          test -d .bootstrap-extract/taxtrace-phases-0-3
          rsync -a .bootstrap-extract/taxtrace-phases-0-3/ ./
          rm -rf .bootstrap-extract taxtrace-phases-0-3.zip bootstrap
          rm -f .github/workflows/bootstrap-taxtrace.yml

      - name: Commit extracted repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Extract complete TaxTrace phases 0-3'
          git push origin HEAD:main
