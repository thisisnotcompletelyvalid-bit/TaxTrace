name: Federal Product Data Live Validation

on:
  push:
    branches:
      - data-activation-v1
    paths:
      - '.github/workflows/product-federal-data-live.yml'
      - 'src/taxtrace/cli.py'
      - 'src/taxtrace/warehouse_v2/cli.py'
      - 'src/taxtrace/finance/sources/treasury.py'
      - 'src/taxtrace/warehouse_v2/product_activation.py'
      - 'src/taxtrace/warehouse_v2/usaspending_bulk.py'
      - 'src/taxtrace/warehouse_v2/usaspending_lake.py'
      - 'src/taxtrace/warehouse_v2/federal_receipt.py'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/product-federal-data-live.yml'
      - 'src/taxtrace/cli.py'
      - 'src/taxtrace/warehouse_v2/cli.py'
      - 'src/taxtrace/finance/sources/treasury.py'
      - 'src/taxtrace/warehouse_v2/product_activation.py'
      - 'src/taxtrace/warehouse_v2/usaspending_bulk.py'
      - 'src/taxtrace/warehouse_v2/usaspending_lake.py'
      - 'src/taxtrace/warehouse_v2/federal_receipt.py'
  workflow_dispatch:

jobs:
  activate-federal-product-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taxtrace
          POSTGRES_USER: taxtrace
          POSTGRES_PASSWORD: taxtrace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taxtrace -d taxtrace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://taxtrace:taxtrace@127.0.0.1:5432/taxtrace
      RAW_DATA_DIR: /tmp/taxtrace-data/raw
      WAREHOUSE_DATA_DIR: /tmp/taxtrace-data/warehouse
      APP_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -U pip && pip install -e '.[dev]'
      - run: alembic upgrade head
      - name: Inspect current Treasury workbook and MTS Table 9 schema
        run: |
          python - <<'PY'
          import re
          from collections import Counter, defaultdict
          from pathlib import Path

          import pandas as pd

          from taxtrace.finance.sources.base import HttpFetcher
          from taxtrace.finance.sources.treasury import TreasuryCombinedStatementSource

          root = Path('/tmp/treasury-diagnostic')
          root.mkdir(parents=True, exist_ok=True)
          fetcher = HttpFetcher()
          for kind, url in TreasuryCombinedStatementSource.urls(2025).items():
              path = root / f'{kind}.xlsx'
              path.write_bytes(fetcher.get_bytes(url))
              print('TREASURY_WORKBOOK', kind, url, path.stat().st_size)
              sheets = pd.read_excel(path, sheet_name=None, header=None, dtype=object)
              for sheet_name, frame in sheets.items():
                  print('TREASURY_SHEET', kind, sheet_name, frame.shape)
                  nonempty_rows = 0
                  for row_index, row in frame.head(50).iterrows():
                      values = [str(value).strip() for value in row.tolist() if pd.notna(value) and str(value).strip()]
                      if values:
                          print('TREASURY_HEADER_ROW', kind, sheet_name, int(row_index) + 1, values[:12])
                          nonempty_rows += 1
                          if nonempty_rows >= 15:
                              break
                  for row_index, row in frame.iterrows():
                      for col_index, value in enumerate(row.tolist()):
                          if pd.isna(value):
                              continue
                          text = str(value).strip()
                          if re.search(r'\b(million|thousand|dollar|unit|amount)s?\b', text, re.I):
                              print('TREASURY_UNIT_TEXT', kind, sheet_name, int(row_index) + 1, col_index + 1, repr(text))

          endpoint = 'https://api.fiscaldata.treasury.gov/services/api/fiscal_service/v1/accounting/mts/mts_table_9'
          payload = fetcher.get_json(
              endpoint,
              params={
                  'filter': 'record_fiscal_year:eq:2025,record_calendar_month:eq:09',
                  'sort': 'sequence_number_cd',
                  'page[size]': 1000,
              },
          )
          rows = payload.get('data') or []
          print('MTS9_META_LABELS', payload.get('meta', {}).get('labels'))
          print('MTS9_META_TYPES', payload.get('meta', {}).get('dataTypes'))
          print('MTS9_ROW_COUNT', len(rows))
          print('MTS9_RECORD_TYPES', Counter(row.get('record_type_cd') for row in rows))
          print('MTS9_DATA_TYPES', Counter(row.get('data_type_cd') for row in rows))
          print('MTS9_SEQUENCE_LEVELS', Counter(row.get('sequence_level_nbr') for row in rows))
          samples = defaultdict(list)
          for row in rows:
              record_type = row.get('record_type_cd') or '<blank>'
              if len(samples[record_type]) < 12:
                  samples[record_type].append({
                      key: row.get(key)
                      for key in (
                          'record_date', 'record_type_cd', 'data_type_cd', 'line_code_nbr',
                          'sequence_level_nbr', 'sequence_number_cd', 'classification_desc',
                          'current_fytd_rcpt_outly_amt',
                      )
                  })
          for record_type, sample_rows in sorted(samples.items()):
              print('MTS9_RECORD_TYPE_SAMPLE', record_type, sample_rows)
          PY
      - name: Seed federal methodology and ingest current real federal controls
        run: |
          taxtrace warehouse seed
          taxtrace warehouse ingest-treasury --fiscal-year 2025
          taxtrace warehouse ingest-omb --fiscal-year 2025
      - name: Materialize full-year USAspending A/B/C account data
        run: taxtrace data bootstrap-federal-accounts --fiscal-year 2025 --period 12
      - name: Verify federal readiness and substantive V2 receipt detail
        run: |
          python - <<'PY'
          from decimal import Decimal

          from taxtrace.allocation.models import FederalReceiptRequest
          from taxtrace.database import SessionLocal
          from taxtrace.enums import FilingStatus
          from taxtrace.search import rebuild_search_index
          from taxtrace.warehouse_v2.federal_receipt import FederalReceiptV2Engine
          from taxtrace.warehouse_v2.product_activation import product_data_readiness

          request = FederalReceiptRequest(
              tax_year=2026,
              spending_fiscal_year=2025,
              filing_status=FilingStatus.SINGLE,
              wage_income=Decimal('50000'),
              spouse_wage_income=Decimal('0'),
              qualifying_children_under_17=0,
              other_dependents=0,
          )
          with SessionLocal() as session:
              rebuild_search_index(session)
              status = product_data_readiness(session, federal_fiscal_year=2025)
              print(status.to_dict())
              assert status.federal_core_ready is True, status
              assert status.federal_account_detail_ready is True, status
              assert status.real_omb_account_rows >= 500, status
              assert status.usaspending_file_b.full_fiscal_year is True, status
              assert status.usaspending_file_b.row_count > 0, status
              assert status.usaspending_file_b.local_parquet_objects == status.usaspending_file_b.parquet_objects > 0, status
              assert status.usaspending_file_c.full_fiscal_year is True, status
              assert status.usaspending_file_c.row_count > 0, status

              receipt = FederalReceiptV2Engine().calculate(session, request)
              assert receipt.warehouse.status == 'READY', receipt.warehouse
              assert receipt.warehouse.full_fiscal_year is True, receipt.warehouse
              assert receipt.conservation_difference == Decimal('0.00'), receipt
              matched = [account for account in receipt.accounts if account.warehouse_matched]
              assert matched, 'No OMB account matched full-year File B detail'
              assert any(len(account.children) > 1 for account in matched), matched[:10]
              print({
                  'total_allocable_taxes': str(receipt.base_receipt.total_allocable_taxes),
                  'omb_accounts': len(receipt.accounts),
                  'file_b_matched_accounts': len(matched),
                  'file_b_rows': receipt.warehouse.row_count,
                  'file_b_objects': receipt.warehouse.object_count,
              })
          PY
