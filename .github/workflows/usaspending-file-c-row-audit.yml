name: USAspending File C Row Audit

on:
  push:
    branches:
      - file-c-row-audit
    paths:
      - '.github/workflows/usaspending-file-c-row-audit.yml'
  workflow_dispatch:

jobs:
  audit-pinned-file-c-python-csv:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RAW_DATA_DIR: /tmp/taxtrace-data/raw
      WAREHOUSE_DATA_DIR: /tmp/taxtrace-data/warehouse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -U pip && pip install -e '.[dev]'
      - name: Compare Python CSV parsing on malformed File C members
        run: |
          python - <<'PY'
          import csv
          import io
          from pathlib import Path
          from zipfile import ZipFile

          from taxtrace.warehouse_v2.download import stream_download

          url = (
              "https://files.usaspending.gov/generated_downloads/"
              "FY2025P01-P12_All_FA_AccountBreakdownByAward_2026-09-23_H17M40S09861275.zip"
          )
          archive_path = Path("/tmp/taxtrace-file-c-audit.zip")
          stream_download(url, archive_path)
          print("archive_bytes", archive_path.stat().st_size)

          targets = {
              "FY2025P01-P12_All_FA_Assistance_AccountBreakdownByAward_2026-09-23_H17M42S36_13.csv",
              "FY2025P01-P12_All_FA_Assistance_AccountBreakdownByAward_2026-09-23_H17M42S36_04.csv",
              "FY2025P01-P12_All_FA_Assistance_AccountBreakdownByAward_2026-09-23_H17M42S36_07.csv",
              "FY2025P01-P12_All_FA_Assistance_AccountBreakdownByAward_2026-09-23_H17M42S36_16.csv",
          }

          with ZipFile(archive_path) as archive:
              for name in sorted(targets):
                  info = archive.getinfo(name)
                  with archive.open(info) as raw:
                      text = io.TextIOWrapper(raw, encoding="utf-8-sig", errors="replace", newline="")
                      reader = csv.reader(text)
                      header = next(reader)
                      width = len(header)
                      total = 0
                      strict_key = 0
                      blank_key = 0
                      short_rows = 0
                      long_rows = 0
                      invalid_key = 0
                      invalid_samples = []
                      length_counts = {}

                      for row in reader:
                          total += 1
                          length_counts[len(row)] = length_counts.get(len(row), 0) + 1
                          if len(row) < width:
                              short_rows += 1
                          elif len(row) > width:
                              long_rows += 1
                          key = row[0].strip() if row else ""
                          if len(key) == 8 and key[:3].isdigit() and key[3] == "-" and key[4:].isdigit():
                              strict_key += 1
                          else:
                              invalid_key += 1
                              if not key:
                                  blank_key += 1
                              if len(invalid_samples) < 20:
                                  invalid_samples.append((len(row), row[:4]))

                  print("PYTHON_MEMBER", name)
                  print("PYTHON_HEADER_WIDTH", width)
                  print("PYTHON_TOTAL", total)
                  print("PYTHON_STRICT_KEY", strict_key)
                  print("PYTHON_INVALID_KEY", invalid_key)
                  print("PYTHON_BLANK_KEY", blank_key)
                  print("PYTHON_SHORT_ROWS", short_rows)
                  print("PYTHON_LONG_ROWS", long_rows)
                  print("PYTHON_LENGTH_COUNTS", sorted(length_counts.items())[:25])
                  print("PYTHON_INVALID_SAMPLES", invalid_samples)

          PY
