name: USAspending File C Row Audit

on:
  push:
    branches:
      - file-c-row-audit
    paths:
      - '.github/workflows/usaspending-file-c-row-audit.yml'
  workflow_dispatch:

jobs:
  audit-pinned-file-c:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RAW_DATA_DIR: /tmp/taxtrace-data/raw
      WAREHOUSE_DATA_DIR: /tmp/taxtrace-data/warehouse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -U pip && pip install -e '.[dev]'
      - name: Audit rejected rows in pinned FY2025 P12 all-agency File C
        run: |
          python - <<'PY'
          import shutil
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from zipfile import ZipFile

          import duckdb

          from taxtrace.warehouse_v2.download import stream_download

          url = (
              "https://files.usaspending.gov/generated_downloads/"
              "FY2025P01-P12_All_FA_AccountBreakdownByAward_2026-09-23_H17M40S09861275.zip"
          )
          archive_path = Path("/tmp/taxtrace-file-c-audit.zip")
          stream_download(url, archive_path)
          print("archive_bytes", archive_path.stat().st_size)

          totals = {
              "parsed": 0,
              "strict_key": 0,
              "broad_key": 0,
              "invalid_key": 0,
              "invalid_with_numeric_outlay": 0,
              "invalid_with_award_key": 0,
              "blank_key": 0,
          }
          samples = []

          with ZipFile(archive_path) as archive, TemporaryDirectory(prefix="taxtrace-file-c-audit-") as temp_dir:
              temp_root = Path(temp_dir)
              members = [
                  member for member in archive.infolist()
                  if not member.is_dir() and member.filename.lower().endswith(".csv")
              ]
              print("member_count", len(members))

              for index, member in enumerate(members, start=1):
                  extracted = temp_root / f"{index:04d}.csv"
                  with archive.open(member) as source, extracted.open("wb") as target:
                      shutil.copyfileobj(source, target, length=1024 * 1024)

                  con = duckdb.connect()
                  try:
                      path = str(extracted).replace("'", "''")
                      relation = (
                          "read_csv_auto('"
                          + path
                          + "', header=true, delim=',', all_varchar=true, sample_size=-1, "
                          + "strict_mode=false, null_padding=true, parallel=false)"
                      )
                      columns = {
                          str(row[0]).lower(): str(row[0])
                          for row in con.execute(f"SELECT * FROM {relation} LIMIT 0").description
                      }
                      key = columns["federal_account_symbol"].replace('"', '""')
                      amount = columns["gross_outlay_amount_fyb_to_period_end"].replace('"', '""')
                      award = columns["award_unique_key"].replace('"', '""')
                      q = f"""
                          SELECT
                              count(*) AS parsed,
                              count(*) FILTER (
                                  WHERE regexp_full_match(trim(CAST("{key}" AS VARCHAR)), '[0-9]{{3}}-[0-9]{{4}}')
                              ) AS strict_key,
                              count(*) FILTER (
                                  WHERE regexp_full_match(trim(CAST("{key}" AS VARCHAR)), '[0-9]{{1,3}}-[0-9]{{1,4}}')
                              ) AS broad_key,
                              count(*) FILTER (
                                  WHERE NOT coalesce(regexp_full_match(trim(CAST("{key}" AS VARCHAR)), '[0-9]{{3}}-[0-9]{{4}}'), false)
                              ) AS invalid_key,
                              count(*) FILTER (
                                  WHERE NOT coalesce(regexp_full_match(trim(CAST("{key}" AS VARCHAR)), '[0-9]{{3}}-[0-9]{{4}}'), false)
                                    AND try_cast("{amount}" AS DECIMAL(38,2)) IS NOT NULL
                              ) AS invalid_with_numeric_outlay,
                              count(*) FILTER (
                                  WHERE NOT coalesce(regexp_full_match(trim(CAST("{key}" AS VARCHAR)), '[0-9]{{3}}-[0-9]{{4}}'), false)
                                    AND nullif(trim(CAST("{award}" AS VARCHAR)), '') IS NOT NULL
                              ) AS invalid_with_award_key,
                              count(*) FILTER (
                                  WHERE nullif(trim(CAST("{key}" AS VARCHAR)), '') IS NULL
                              ) AS blank_key
                          FROM {relation}
                      """
                      row = con.execute(q).fetchone()
                      names = list(totals)
                      for name, value in zip(names, row, strict=True):
                          totals[name] += int(value or 0)

                      if row[3] and len(samples) < 80:
                          sample_rows = con.execute(
                              f"""
                              SELECT
                                  CAST("{key}" AS VARCHAR),
                                  CAST("{amount}" AS VARCHAR),
                                  CAST("{award}" AS VARCHAR)
                              FROM {relation}
                              WHERE NOT coalesce(
                                  regexp_full_match(trim(CAST("{key}" AS VARCHAR)), '[0-9]{{3}}-[0-9]{{4}}'),
                                  false
                              )
                              LIMIT {80 - len(samples)}
                              """
                          ).fetchall()
                          samples.extend((member.filename, *values) for values in sample_rows)
                  finally:
                      con.close()
                      extracted.unlink(missing_ok=True)

                  print("member_progress", index, member.filename, dict(totals))

          print("FINAL_TOTALS", totals)
          print("STRICT_DEFICIT_VS_GENERATOR", 39777645 - totals["strict_key"])
          print("PARSED_DELTA_VS_GENERATOR", totals["parsed"] - 39777645)
          print("INVALID_SAMPLES")
          for sample in samples:
              print(repr(sample))

          assert totals["parsed"] > 0
          assert totals["strict_key"] > 0
          PY
