name: Census Taxonomy Live Validation

on:
  push:
    branches:
      - census-additive-taxonomy
    paths:
      - '.github/workflows/census-taxonomy-live-validation.yml'
  workflow_dispatch:

jobs:
  reconcile-2022:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -U pip && pip install -e '.[dev]'
      - name: Download official 2022 Census finance archive
        run: |
          mkdir -p /tmp/taxtrace-census
          python - <<'PY'
          from pathlib import Path
          from taxtrace.warehouse_v2.download import stream_download
          stream_download(
              'https://www2.census.gov/programs-surveys/gov-finances/tables/2022/2022_Individual_Unit_File.zip',
              Path('/tmp/taxtrace-census/2022_Individual_Unit_File.zip'),
              overwrite=True,
          )
          PY
      - name: Reconcile individual units to state-type public-use file
        run: |
          python - <<'PY'
          from collections import Counter, defaultdict
          from decimal import Decimal
          from pathlib import Path
          from zipfile import ZipFile

          from taxtrace.warehouse_v2.census import iter_finance_records
          from taxtrace.warehouse_v2.census_taxonomy import POST_2022_DIRECT_GENERAL_EXPENDITURE_CODES

          source = Path('/tmp/taxtrace-census/2022_Individual_Unit_File.zip')
          raw_by_type_code = defaultdict(lambda: Decimal('0'))
          raw_by_code = defaultdict(lambda: Decimal('0'))
          for record in iter_finance_records(source):
              code = record.item_code.upper()
              amount = record.amount_dollars
              gov_type = record.government_id[2]
              raw_by_type_code[(gov_type, code)] += amount
              raw_by_code[code] += amount

          with ZipFile(source) as archive:
              state_type_name = next(name for name in archive.namelist() if name.endswith('22statetypepu.txt'))
              lines = archive.read(state_type_name).decode('utf-8-sig', errors='replace').splitlines()
              technical_name = next(name for name in archive.namelist() if name.endswith('Technical Documentation.pdf'))
              Path('/tmp/taxtrace-census/technical.pdf').write_bytes(archive.read(technical_name))

          prefixes = Counter()
          public_by_state_type_code = defaultdict(lambda: Decimal('0'))
          for line in lines:
              if len(line) < 20:
                  continue
              prefix = line[:3]
              item = line[4:7].strip().upper()
              try:
                  amount_thousands = Decimal(line[7:20].strip())
              except Exception:
                  continue
              prefixes[prefix] += 1
              state = prefix[:2]
              gov_type = prefix[2]
              public_by_state_type_code[(state, gov_type, item)] += amount_thousands * Decimal('1000')

          print('PREFIX_SAMPLE', prefixes.most_common(30))
          print('NATIONAL_PREFIXES', sorted((p, n) for p, n in prefixes.items() if p.startswith('00')))

          print('TYPE_RECONCILIATION')
          for gov_type in '012345':
              raw_total = sum(
                  (raw_by_type_code[(gov_type, code)] for code in POST_2022_DIRECT_GENERAL_EXPENDITURE_CODES),
                  Decimal('0'),
              )
              public_total = sum(
                  (public_by_state_type_code[('00', gov_type, code)] for code in POST_2022_DIRECT_GENERAL_EXPENDITURE_CODES),
                  Decimal('0'),
              )
              print('TYPE_TOTAL', gov_type, 'raw', raw_total, 'public', public_total, 'difference', raw_total - public_total)

          print('EDUCATION_RECONCILIATION')
          for gov_type in '012345':
              raw = raw_by_type_code[(gov_type, 'E12')] + raw_by_type_code[(gov_type, 'F12')]
              public = public_by_state_type_code[('00', gov_type, 'E12')] + public_by_state_type_code[('00', gov_type, 'F12')]
              print('E12_F12', gov_type, 'raw', raw, 'public', public, 'difference', raw - public)

          print('LARGEST_TYPE_CODE_DIFFERENCES')
          diffs = []
          for gov_type in '012345':
              for code in sorted(POST_2022_DIRECT_GENERAL_EXPENDITURE_CODES):
                  raw = raw_by_type_code[(gov_type, code)]
                  public = public_by_state_type_code[('00', gov_type, code)]
                  diff = raw - public
                  if diff:
                      diffs.append((abs(diff), gov_type, code, raw, public, diff))
          for _, gov_type, code, raw, public, diff in sorted(diffs, reverse=True)[:80]:
              print('TYPE_CODE_DIFF', gov_type, code, 'raw', raw, 'public', public, 'difference', diff)

          print('ACTIVE_F_CODES_OUTSIDE_FORMULA')
          outside_f = [
              (amount, code)
              for code, amount in raw_by_code.items()
              if code.startswith('F') and code not in POST_2022_DIRECT_GENERAL_EXPENDITURE_CODES and amount != 0
          ]
          for amount, code in sorted(outside_f, reverse=True)[:50]:
              print('OUTSIDE_F', code, amount)
          PY
      - name: Inspect technical documentation for tabulation notes
        run: |
          pdftotext -layout /tmp/taxtrace-census/technical.pdf /tmp/taxtrace-census/technical.txt
          echo '--- dependent / school / state type / public use / aggregate matches ---'
          grep -inE 'dependent|school|state.?type|public use|aggregate|double.?count|parent|PID' /tmp/taxtrace-census/technical.txt | head -n 200 || true
