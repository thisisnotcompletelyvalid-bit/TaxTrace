name: Census Taxonomy Live Validation

on:
  push:
    branches:
      - census-additive-taxonomy
    paths:
      - '.github/workflows/census-taxonomy-live-validation.yml'
  workflow_dispatch:

jobs:
  reconcile-2022:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -U pip && pip install -e '.[dev]'
      - name: Download current Census revision files
        run: |
          mkdir -p /tmp/taxtrace-census
          python - <<'PY'
          from pathlib import Path
          from taxtrace.warehouse_v2.download import stream_download

          root = Path('/tmp/taxtrace-census')
          for url, name in (
              ('https://www2.census.gov/programs-surveys/gov-finances/tables/2022/2022_Individual_Unit_File.zip', '2022_Individual_Unit_File.zip'),
              ('https://www2.census.gov/programs-surveys/gov-finances/data/GS00LOCALFIN.zip', 'GS00LOCALFIN.zip'),
          ):
              stream_download(url, root / name, overwrite=True)
          PY
      - name: Inspect GS00LOCALFIN archive and candidate 2022 records
        run: |
          python - <<'PY'
          import csv
          import io
          from pathlib import Path
          from zipfile import ZipFile

          root = Path('/tmp/taxtrace-census')
          archive_path = root / 'GS00LOCALFIN.zip'
          with ZipFile(archive_path) as archive:
              print('GS00LOCALFIN_MEMBERS')
              for member in archive.infolist():
                  print('MEMBER', member.filename, member.file_size, member.compress_size)
                  if member.is_dir():
                      continue
                  raw = archive.read(member)
                  text = raw.decode('utf-8-sig', errors='replace')
                  lines = text.splitlines()
                  print('LINE_COUNT', member.filename, len(lines))
                  for index, line in enumerate(lines[:40], start=1):
                      print('FIRST_LINE', member.filename, index, len(line), repr(line[:600]))

                  if not lines:
                      continue
                  sample = '\n'.join(lines[:20])
                  try:
                      dialect = csv.Sniffer().sniff(sample, delimiters=',|\t;')
                      print('SNIFFED_DELIMITER', member.filename, repr(dialect.delimiter))
                      reader = csv.reader(io.StringIO(text), dialect)
                      for index, row in enumerate(reader):
                          if index >= 15:
                              break
                          print('PARSED_ROW', member.filename, index + 1, row[:40])
                  except Exception as exc:
                      print('SNIFFER_FAILED', member.filename, repr(exc))

                  print('LINES_WITH_2022_AND_DIRECT')
                  matches = 0
                  for index, line in enumerate(lines, start=1):
                      lowered = line.lower()
                      if '2022' in line and ('direct general' in lowered or 'general expenditure' in lowered or 'fire protection' in lowered):
                          print('MATCH', member.filename, index, repr(line[:1000]))
                          matches += 1
                          if matches >= 50:
                              break
                  print('MATCH_COUNT_PRINTED', matches)
          PY
