name: Census Taxonomy Live Validation

on:
  push:
    branches:
      - census-additive-taxonomy
    paths:
      - '.github/workflows/census-taxonomy-live-validation.yml'
  workflow_dispatch:

jobs:
  reconcile-2022:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -U pip && pip install -e '.[dev]'
      - name: Download official Census source files
        run: |
          mkdir -p /tmp/taxtrace-census
          python - <<'PY'
          from pathlib import Path
          from taxtrace.warehouse_v2.download import stream_download

          root = Path('/tmp/taxtrace-census')
          for url, name in (
              ('https://www2.census.gov/programs-surveys/gov-finances/tables/2022/2022_Individual_Unit_File.zip', '2022_Individual_Unit_File.zip'),
              ('https://www2.census.gov/programs-surveys/state/technical-documentation/methodology/methodology_summary_tabulations.xlsx', 'methodology_summary_tabulations.xlsx'),
              ('https://www2.census.gov/programs-surveys/gov-finances/tables/2022/22slsstab1.xlsx', '22slsstab1.xlsx'),
          ):
              stream_download(url, root / name, overwrite=True)
          PY
      - name: Identify governing formula variant and reconciliation gap
        run: |
          python - <<'PY'
          from collections import defaultdict
          from decimal import Decimal
          from pathlib import Path
          from zipfile import ZipFile

          from openpyxl import load_workbook

          root = Path('/tmp/taxtrace-census')
          method = load_workbook(root / 'methodology_summary_tabulations.xlsx', read_only=True, data_only=True)
          sheet = method['Summary Tabulations']

          print('METHODOLOGY_HEADER_ROWS')
          for row_index in range(1, 5):
              print('HEADER', row_index, [cell.value for cell in sheet[row_index]])

          row177 = [cell.value for cell in sheet[177]]
          print('ROW177', row177)
          formula_columns = {'D': 3, 'F': 5, 'H': 7, 'J': 9, 'L': 11}
          formulas = {}
          for label, zero_index in formula_columns.items():
              value = row177[zero_index]
              codes = tuple(code.strip() for code in str(value).split(',') if code and code.strip())
              formulas[label] = codes
              print('FORMULA_VARIANT', label, 'count', len(codes), 'codes', codes)

          print('FIRE_ROWS')
          for row_index, row in enumerate(sheet.iter_rows(values_only=True), start=1):
              values = list(row)
              joined = ' | '.join(str(value) for value in values if value is not None)
              if 'E24' in joined or 'F24' in joined or 'Fire Protection' in joined:
                  print('FIRE_ROW', row_index, values)

          source = root / '2022_Individual_Unit_File.zip'
          with ZipFile(source) as archive:
              state_type_name = next(name for name in archive.namelist() if name.endswith('22statetypepu.txt'))
              lines = archive.read(state_type_name).decode('utf-8-sig', errors='replace').splitlines()

          public_all = defaultdict(lambda: Decimal('0'))
          for line in lines:
              if len(line) < 20 or line[:3] != '001':
                  continue
              code = line[4:7].strip().upper()
              try:
                  public_all[code] += Decimal(line[7:20].strip()) * Decimal('1000')
              except Exception:
                  pass

          published = load_workbook(root / '22slsstab1.xlsx', read_only=True, data_only=True)
          published_sheet = published[published.sheetnames[0]]
          published_direct_general = Decimal(str(published_sheet['C91'].value)) * Decimal('1000')
          published_capital = Decimal(str(published_sheet['C92'].value)) * Decimal('1000')
          print('PUBLISHED_CONTROLS', {'direct_general': str(published_direct_general), 'capital': str(published_capital)})

          for label, codes in formulas.items():
              total = sum((public_all[code] for code in codes), Decimal('0'))
              print('VARIANT_RECONCILIATION', label, 'total', total, 'difference', total - published_direct_general)

          all_candidate_codes = set().union(*map(set, formulas.values()))
          active_expenditure = {
              code: amount
              for code, amount in public_all.items()
              if code and code[0] in {'E', 'F', 'G', 'I', 'J', 'K'} and amount != 0
          }
          print('ACTIVE_EXPENDITURE_OUTSIDE_ALL_VARIANTS')
          for code, amount in sorted(
              ((code, amount) for code, amount in active_expenditure.items() if code not in all_candidate_codes),
              key=lambda pair: pair[1],
              reverse=True,
          ):
              print('OUTSIDE_ALL', code, amount)

          print('J_VARIANT_EXCLUDED_ACTIVE_CODES')
          j_codes = set(formulas['J'])
          for code, amount in sorted(
              ((code, amount) for code, amount in active_expenditure.items() if code not in j_codes),
              key=lambda pair: pair[1],
              reverse=True,
          ):
              print('J_EXCLUDED', code, amount)

          target_offset = published_direct_general - sum((public_all[code] for code in formulas['J']), Decimal('0'))
          print('J_TARGET_OFFSET', target_offset)
          nearest = sorted(active_expenditure.items(), key=lambda pair: abs(pair[1] - target_offset))[:30]
          for code, amount in nearest:
              print('NEAREST_SINGLE', code, amount, 'remaining', target_offset - amount)
          PY
