name: Census Taxonomy Live Validation

on:
  push:
    branches:
      - census-additive-taxonomy
    paths:
      - '.github/workflows/census-taxonomy-live-validation.yml'
  workflow_dispatch:

jobs:
  reconcile-2022:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -U pip && pip install -e '.[dev]'
      - name: Download official Census source files
        run: |
          mkdir -p /tmp/taxtrace-census
          python - <<'PY'
          from pathlib import Path
          from taxtrace.warehouse_v2.download import stream_download

          root = Path('/tmp/taxtrace-census')
          stream_download(
              'https://www2.census.gov/programs-surveys/gov-finances/tables/2022/2022_Individual_Unit_File.zip',
              root / '2022_Individual_Unit_File.zip',
              overwrite=True,
          )
          stream_download(
              'https://www2.census.gov/programs-surveys/state/technical-documentation/methodology/methodology_summary_tabulations.xlsx',
              root / 'methodology_summary_tabulations.xlsx',
              overwrite=True,
          )
          stream_download(
              'https://www2.census.gov/programs-surveys/gov-finances/tables/2022/22slsstab1.xlsx',
              root / '22slsstab1.xlsx',
              overwrite=True,
          )
          PY
      - name: Extract direct-general formulas from Census methodology workbook
        run: |
          python - <<'PY'
          from pathlib import Path
          from openpyxl import load_workbook

          root = Path('/tmp/taxtrace-census')
          path = root / 'methodology_summary_tabulations.xlsx'
          workbook_formula = load_workbook(path, read_only=True, data_only=False)
          workbook_values = load_workbook(path, read_only=True, data_only=True)
          print('FORMULA_WORKBOOK_SHEETS', workbook_formula.sheetnames)

          needles = (
              'direct general',
              'capital outlay',
              'other direct general',
              'elementary',
              'higher education',
              'education',
              'interest on debt',
              'assistance and subsidies',
          )
          for sheet_name in workbook_formula.sheetnames:
              formula_sheet = workbook_formula[sheet_name]
              value_sheet = workbook_values[sheet_name]
              print('SHEET_DIMENSIONS', sheet_name, formula_sheet.max_row, formula_sheet.max_column)
              matches = []
              for row_index, row in enumerate(formula_sheet.iter_rows(values_only=True), start=1):
                  text = ' | '.join(str(value) for value in row if value is not None).lower()
                  if any(needle in text for needle in needles):
                      matches.append(row_index)
              print('MATCH_ROWS', sheet_name, matches[:300])
              expanded = set()
              for row_index in matches:
                  for candidate in range(max(1, row_index - 2), min(formula_sheet.max_row, row_index + 2) + 1):
                      expanded.add(candidate)
              for row_index in sorted(expanded):
                  formula_values = [cell.value for cell in formula_sheet[row_index]]
                  data_values = [cell.value for cell in value_sheet[row_index]]
                  print('FORMULA_ROW', sheet_name, row_index, formula_values[:40])
                  if data_values != formula_values:
                      print('VALUE_ROW', sheet_name, row_index, data_values[:40])
          PY
      - name: Compare methodology formulas with public-use and published controls
        run: |
          python - <<'PY'
          from collections import defaultdict
          from decimal import Decimal
          from pathlib import Path
          from zipfile import ZipFile
          from openpyxl import load_workbook

          from taxtrace.warehouse_v2.census import iter_finance_records
          from taxtrace.warehouse_v2.census_taxonomy import POST_2022_DIRECT_GENERAL_EXPENDITURE_CODES

          root = Path('/tmp/taxtrace-census')
          source = root / '2022_Individual_Unit_File.zip'
          raw_by_code = defaultdict(lambda: Decimal('0'))
          for record in iter_finance_records(source):
              raw_by_code[record.item_code.upper()] += record.amount_dollars

          with ZipFile(source) as archive:
              state_type_name = next(name for name in archive.namelist() if name.endswith('22statetypepu.txt'))
              lines = archive.read(state_type_name).decode('utf-8-sig', errors='replace').splitlines()

          public_all = defaultdict(lambda: Decimal('0'))
          for line in lines:
              if len(line) < 20 or line[:3] != '001':
                  continue
              item = line[4:7].strip().upper()
              try:
                  amount = Decimal(line[7:20].strip()) * Decimal('1000')
              except Exception:
                  continue
              public_all[item] += amount

          raw_formula_total = sum((raw_by_code[code] for code in POST_2022_DIRECT_GENERAL_EXPENDITURE_CODES), Decimal('0'))
          public_formula_total = sum((public_all[code] for code in POST_2022_DIRECT_GENERAL_EXPENDITURE_CODES), Decimal('0'))
          print('CURRENT_FORMULA_TOTALS', {'raw': str(raw_formula_total), 'public_001': str(public_formula_total), 'difference': str(raw_formula_total - public_formula_total)})

          published = load_workbook(root / '22slsstab1.xlsx', read_only=True, data_only=True)
          sheet = published[published.sheetnames[0]]
          for row_index in range(82, 101):
              values = list(next(sheet.iter_rows(min_row=row_index, max_row=row_index, values_only=True)))
              print('PUBLISHED_ROW', row_index, values[:8])
          PY
