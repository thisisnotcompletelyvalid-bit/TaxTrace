name: Census Taxonomy Live Validation

on:
  push:
    branches:
      - census-additive-taxonomy
    paths:
      - '.github/workflows/census-taxonomy-live-validation.yml'
  workflow_dispatch:

jobs:
  reconcile-2022:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -U pip && pip install -e '.[dev]'
      - name: Download official Census source files
        run: |
          mkdir -p /tmp/taxtrace-census
          python - <<'PY'
          from pathlib import Path
          from taxtrace.warehouse_v2.download import stream_download

          root = Path('/tmp/taxtrace-census')
          for url, name in (
              ('https://www2.census.gov/programs-surveys/state/technical-documentation/methodology/methodology_summary_tabulations.xlsx', 'methodology_summary_tabulations.xlsx'),
              ('https://www2.census.gov/programs-surveys/gov-finances/tables/2022/22slsstab1.xlsx', '22slsstab1.xlsx'),
          ):
              stream_download(url, root / name, overwrite=True)
          PY
      - name: Compare published function rows with summary methodology
        run: |
          python - <<'PY'
          from decimal import Decimal
          from pathlib import Path

          from openpyxl import load_workbook

          root = Path('/tmp/taxtrace-census')
          published = load_workbook(root / '22slsstab1.xlsx', read_only=True, data_only=True)
          p = published[published.sheetnames[0]]
          method = load_workbook(root / 'methodology_summary_tabulations.xlsx', read_only=True, data_only=True)
          m = method['Summary Tabulations']

          print('PUBLISHED_MATCHES')
          needles = (
              'fire',
              'utility',
              'utilities',
              'liquor',
              'direct general',
              'direct expenditure',
              'general expenditure',
              'interest on debt',
              'assistance and subsidies',
          )
          for row_index, row in enumerate(p.iter_rows(values_only=True), start=1):
              values = list(row)
              description = str(values[1] or '').strip().lower() if len(values) > 1 else ''
              if any(needle in description for needle in needles):
                  print('PUBLISHED_MATCH', row_index, values[:8])

          print('PUBLISHED_FUNCTION_BLOCK')
          for row_index in range(90, 170):
              values = list(next(p.iter_rows(min_row=row_index, max_row=row_index, values_only=True)))
              if len(values) > 2 and values[1] not in (None, ''):
                  print('PUBLISHED_FUNCTION', row_index, values[0], str(values[1]).strip(), values[2], values[4], values[5])

          print('METHODOLOGY_EXPENDITURE_ROWS')
          for row_index, row in enumerate(m.iter_rows(values_only=True), start=1):
              values = list(row)
              description = str(values[2] or '') if len(values) > 2 else ''
              lowered = description.lower()
              if any(
                  needle in lowered
                  for needle in (
                      'total expenditure',
                      'total general expenditure',
                      'utility',
                      'liquor',
                      'fire',
                  )
              ):
                  print('METHOD_ROW', row_index, values[:13])

          direct_total = Decimal(str(p['C90'].value)) * Decimal('1000')
          direct_general = Decimal(str(p['C91'].value)) * Decimal('1000')
          print('DIRECT_SECTOR_DIFFERENCE', {
              'direct_expenditure_by_function': str(direct_total),
              'direct_general_expenditure': str(direct_general),
              'difference': str(direct_total - direct_general),
          })
          PY
