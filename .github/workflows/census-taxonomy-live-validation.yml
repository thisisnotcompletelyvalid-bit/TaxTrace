name: Census Taxonomy Live Validation

on:
  push:
    branches:
      - census-additive-taxonomy
    paths:
      - '.github/workflows/census-taxonomy-live-validation.yml'
  workflow_dispatch:

jobs:
  reconcile-2022:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -U pip && pip install -e '.[dev]'
      - name: Download official 2022 Census finance archive
        run: |
          mkdir -p /tmp/taxtrace-census
          python - <<'PY'
          from pathlib import Path
          from taxtrace.warehouse_v2.download import stream_download
          stream_download(
              'https://www2.census.gov/programs-surveys/gov-finances/tables/2022/2022_Individual_Unit_File.zip',
              Path('/tmp/taxtrace-census/2022_Individual_Unit_File.zip'),
              overwrite=True,
          )
          PY
      - name: Inspect parent-ID file and raw finance layout
        run: |
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          from zipfile import ZipFile

          source = Path('/tmp/taxtrace-census/2022_Individual_Unit_File.zip')
          with ZipFile(source) as archive:
              members = {m.filename: m for m in archive.infolist()}
              pid_name = next(name for name in members if name.endswith('Fin_PID_2022.txt'))
              fin_name = next(name for name in members if 'FinEstDAT' in name)
              state_type_name = next(name for name in members if name.endswith('22statetypepu.txt'))

              print('PID_MEMBER', pid_name, members[pid_name].file_size)
              print('FINANCE_MEMBER', fin_name, members[fin_name].file_size)
              print('STATE_TYPE_MEMBER', state_type_name, members[state_type_name].file_size)

              pid_lines = archive.read(pid_name).decode('utf-8-sig', errors='replace').splitlines()
              fin_lines = archive.read(fin_name).decode('utf-8-sig', errors='replace').splitlines()
              state_lines = archive.read(state_type_name).decode('utf-8-sig', errors='replace').splitlines()

              print('PID_LINE_COUNT', len(pid_lines))
              print('PID_FIRST_LINES')
              for index, line in enumerate(pid_lines[:60], start=1):
                  print('PID_LINE', index, len(line), repr(line))

              print('FINANCE_FIRST_LINES')
              for index, line in enumerate(fin_lines[:15], start=1):
                  print('FIN_LINE', index, len(line), repr(line))

              print('STATE_TYPE_FIRST_LINES')
              for index, line in enumerate(state_lines[:30], start=1):
                  print('STATE_LINE', index, len(line), repr(line))

              pid_lengths = Counter(map(len, pid_lines))
              pid_prefixes = Counter(line[:2] for line in pid_lines if line)
              print('PID_LENGTHS', pid_lengths.most_common(20))
              print('PID_PREFIXES', pid_prefixes.most_common(20))
          PY
