name: USAspending Live Archive Validation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/usaspending-archive-diagnostic.yml'

jobs:
  validate-federal-account-file-c:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -U pip && pip install -e '.[dev]'
      - name: Generate real FY2025 P12 all-agency File C at federal-account grain
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          from taxtrace.warehouse_v2.usaspending_bulk import USASpendingBulkClient
          from taxtrace.warehouse_v2.usaspending_lake import inspect_account_archive

          payload = {
              "account_level": "federal_account",
              "file_format": "csv",
              "filters": {
                  "agency": "all",
                  "fy": "2025",
                  "period": "12",
                  "submission_types": ["award_financial"],
              },
          }

          # Call _submit_one deliberately so this diagnostic probes the native
          # USAspending request shape without TaxTrace's File C transport sharding.
          client = USASpendingBulkClient(timeout=90)
          job = client._submit_one("accounts", payload)
          print("submitted", job.response)
          completed = client.wait(job, poll_seconds=5, max_polls=360)
          print("completed", completed)
          assert completed.get("status") == "finished", completed

          destination = Path("data/raw/usaspending/fa-file-c-probe") / (job.file_name or "file-c.zip")
          downloaded = client.download_completed(completed, destination)
          assert downloaded.exists() and downloaded.stat().st_size > 0

          inspected = inspect_account_archive(downloaded)
          print(
              "members",
              [(member.member_name, member.submission_type, len(member.columns)) for member in inspected],
          )
          assert inspected
          assert {member.submission_type for member in inspected} == {"C"}

          total_uncompressed = 0
          with ZipFile(downloaded) as archive:
              for member in archive.infolist():
                  if not member.is_dir():
                      total_uncompressed += member.file_size
          print("archive_bytes", downloaded.stat().st_size)
          print("uncompressed_bytes", total_uncompressed)
          print("source_grain", "federal_account_award")
          PY
