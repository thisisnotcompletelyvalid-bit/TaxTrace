name: USAspending File C Projection Validation

on:
  push:
    branches:
      - data-activation-file-c-projection-probe
    paths:
      - '.github/workflows/usaspending-archive-diagnostic.yml'
  workflow_dispatch:

jobs:
  validate-all-agency-projected-file-c:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -U pip && pip install -e '.[dev]'
      - name: Generate FY2025 P12 all-agency File C with product-required columns
        run: |
          python - <<'PY'
          from pathlib import Path

          from taxtrace.warehouse_v2.usaspending_bulk import USASpendingBulkClient
          from taxtrace.warehouse_v2.usaspending_lake import inspect_account_archive

          columns = [
              "federal_account_symbol",
              "gross_outlay_amount_FYB_to_period_end",
              "award_unique_key",
              "award_id_piid",
              "award_id_fain",
              "award_id_uri",
              "recipient_name",
              "recipient_name_raw",
              "recipient_uei",
              "prime_award_base_transaction_description",
              "awarding_agency_name",
              "funding_agency_name",
              "award_type",
              "usaspending_permalink",
          ]
          payload = {
              "account_level": "federal_account",
              "file_format": "csv",
              "columns": columns,
              "filters": {
                  "agency": "all",
                  "fy": "2025",
                  "period": "12",
                  "submission_types": ["award_financial"],
              },
          }

          client = USASpendingBulkClient(timeout=90)
          job = client._submit_one("accounts", payload)
          print("submitted", job.response)
          completed = client.wait(job, poll_seconds=5, max_polls=480)
          print("completed", completed)
          assert completed.get("status") == "finished", completed
          assert int(completed.get("total_rows") or 0) > 0, completed
          assert int(completed.get("total_columns") or 0) == len(columns) * 3, completed

          destination = Path("data/raw/usaspending/all-agency-file-c-product-projection") / (
              job.file_name or "file-c.zip"
          )
          client.download_completed(completed, destination)
          assert destination.exists() and destination.stat().st_size > 0

          members = inspect_account_archive(destination)
          print(
              "members",
              [
                  (member.member_name, member.submission_type, len(member.columns))
                  for member in members
              ],
          )
          assert len(members) == 3, members
          assert {member.submission_type for member in members} == {"C"}
          assert sum(len(member.columns) for member in members) == len(columns) * 3
          required = {
              "federal_account_symbol",
              "gross_outlay_amount_FYB_to_period_end",
              "award_unique_key",
          }
          for member in members:
              assert required.issubset(set(member.columns)), member.member_name

          print("archive_bytes", destination.stat().st_size)
          print("product_columns", columns)
          print("source_grain", "federal_account_award")
          PY
