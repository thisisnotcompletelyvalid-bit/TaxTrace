name: USAspending Live Archive Validation

on:
  push:
    branches:
      - data-activation-diagnostics
    paths:
      - '.github/workflows/usaspending-archive-diagnostic.yml'
  workflow_dispatch:

jobs:
  inspect-fy2025-p12-reporting-universe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -U pip && pip install -e '.[dev]'
      - name: List exact FY2025 P12 reporting agencies and account selectors
        run: |
          python - <<'PY'
          from taxtrace.warehouse_v2.usaspending_bulk import USASpendingBulkClient

          client = USASpendingBulkClient(timeout=90)
          agencies = client.current_reporting_account_agencies(2025, 12)
          print("agency_count", len(agencies))
          for index, agency in enumerate(agencies, start=1):
              print(
                  index,
                  agency["toptier_code"],
                  agency["abbreviation"],
                  agency["toptier_agency_id"],
                  agency.get("name"),
              )
          assert agencies
          PY
