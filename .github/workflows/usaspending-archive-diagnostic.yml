name: USAspending Archive Diagnostic

on:
  push:
    branches: [data-overhaul-v1]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -U pip && pip install -e '.[dev]'
      - name: Compare static and generated USAspending file-host access
        run: |
          python - <<'PY'
          import httpx

          from taxtrace.warehouse_v2.usaspending_bulk import USASpendingBulkClient

          static_url = "https://files.usaspending.gov/reference_data/def_codes.csv"
          static = httpx.get(static_url, follow_redirects=True, timeout=30)
          print("static", static.status_code, static.headers.get("content-type"), len(static.content), repr(static.text[:300]))

          payload = {
              "account_level": "treasury_account",
              "file_format": "csv",
              "filters": {
                  "agency": "all",
                  "fy": "2022",
                  "budget_function": "900",
                  "period": "12",
                  "submission_types": [
                      "account_balances",
                      "object_class_program_activity",
                      "award_financial",
                  ],
              },
          }
          client = USASpendingBulkClient(timeout=90)
          job = client.submit("accounts", payload)
          completed = client.wait(job, poll_seconds=2, max_polls=90)
          url = completed.get("file_url") or completed.get("download_url") or completed.get("url")
          assert url
          generated = httpx.get(url, follow_redirects=True, timeout=30)
          print("generated", generated.status_code, generated.headers.get("content-type"), len(generated.content))
          print("generated_headers", dict(generated.headers))
          print("generated_body", repr(generated.text[:2000]))

          # This diagnostic succeeds as long as the API job machinery works. The output determines
          # whether the CDN can be made a mandatory CI gate or must remain an operational fallback.
          assert completed.get("status") == "ready", completed
          assert static.status_code == 200, static.status_code
          PY
