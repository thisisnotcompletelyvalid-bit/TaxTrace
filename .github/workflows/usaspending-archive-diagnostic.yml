name: USAspending Live Archive Validation

on:
  push:
    branches:
      - data-activation-diagnostics
    paths:
      - '.github/workflows/usaspending-archive-diagnostic.yml'
  workflow_dispatch:

jobs:
  validate-usda-federal-account-file-c:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -U pip && pip install -e '.[dev]'
      - name: Generate exact FY2025 P12 USDA File C at federal-account grain
        run: |
          python - <<'PY'
          from pathlib import Path

          from taxtrace.warehouse_v2.usaspending_bulk import USASpendingBulkClient
          from taxtrace.warehouse_v2.usaspending_lake import inspect_account_archive

          payload = {
              "account_level": "federal_account",
              "file_format": "csv",
              "filters": {
                  "agency": "14",
                  "fy": "2025",
                  "period": "12",
                  "submission_types": ["award_financial"],
              },
          }

          client = USASpendingBulkClient(timeout=90)
          job = client._submit_one("accounts", payload)
          print("submitted", job.response)
          completed = client.wait(job, poll_seconds=5, max_polls=240)
          print("completed", completed)
          assert completed.get("status") == "finished", completed
          assert int(completed.get("total_rows") or 0) > 0, completed
          assert int(completed.get("total_columns") or 0) == 240, completed

          destination = Path("data/raw/usaspending/fa-file-c-usda-probe") / (
              job.file_name or "file-c.zip"
          )
          client.download_completed(completed, destination)
          assert destination.exists() and destination.stat().st_size > 0

          members = inspect_account_archive(destination)
          print(
              "members",
              [
                  (member.member_name, member.submission_type, len(member.columns))
                  for member in members
              ],
          )
          assert members
          assert {member.submission_type for member in members} == {"C"}
          assert sum(len(member.columns) for member in members) == 240
          for member in members:
              assert "federal_account_symbol" in member.columns, member.member_name
              assert "award_unique_key" in member.columns, member.member_name
              assert "gross_outlay_amount_FYB_to_period_end" in member.columns, member.member_name

          print("archive_bytes", destination.stat().st_size)
          print("source_grain", "federal_account_award")
          PY
