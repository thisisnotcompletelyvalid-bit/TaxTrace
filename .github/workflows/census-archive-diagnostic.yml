name: Census Archive Diagnostic

on:
  push:
    branches: [data-overhaul-v1]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas openpyxl
      - name: Inspect Census 2022 government workbook headers
        run: |
          python - <<'PY'
          import io
          import urllib.request
          import zipfile
          import pandas as pd

          url = 'https://www2.census.gov/programs-surveys/gus/datasets/2022/govt_units_2022.ZIP'
          request = urllib.request.Request(url, headers={'User-Agent': 'TaxTrace/0.4 live-format diagnostic'})
          with urllib.request.urlopen(request, timeout=90) as response:
              content = response.read()
          with zipfile.ZipFile(io.BytesIO(content)) as archive:
              print('members', [(x.filename, x.file_size) for x in archive.infolist()])
              xlsx = next(x for x in archive.infolist() if x.filename.lower().endswith('.xlsx'))
              payload = archive.read(xlsx)
              workbook = pd.ExcelFile(io.BytesIO(payload), engine='openpyxl')
              print('sheets', workbook.sheet_names)
              for sheet in workbook.sheet_names:
                  frame = pd.read_excel(workbook, sheet_name=sheet, dtype=object)
                  print('SHEET', sheet)
                  print('columns', [str(x) for x in frame.columns])
                  print('shape', frame.shape)
                  print('head', frame.head(5).to_dict(orient='records'))
          PY
