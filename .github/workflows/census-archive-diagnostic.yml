name: Census Archive Diagnostic

on:
  push:
    branches: [data-overhaul-v1]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and inspect Census 2022 government archive
        run: |
          python - <<'PY'
          import io
          import urllib.request
          import zipfile

          url = 'https://www2.census.gov/programs-surveys/gus/datasets/2022/govt_units_2022.ZIP'
          request = urllib.request.Request(url, headers={'User-Agent': 'TaxTrace/0.4 live-format diagnostic'})
          with urllib.request.urlopen(request, timeout=90) as response:
              content = response.read()
          print('download_bytes', len(content))
          with zipfile.ZipFile(io.BytesIO(content)) as archive:
              print('members', [(x.filename, x.file_size) for x in archive.infolist()])
              for member in archive.infolist():
                  if member.is_dir():
                      continue
                  data = archive.read(member)
                  print('MEMBER', member.filename, 'first_1500_bytes=', repr(data[:1500]))
                  text = data[:6000].decode('utf-8-sig', errors='replace')
                  print('first_lines', repr(text.splitlines()[:8]))
                  break
          PY
