name: Apply Phase 4-6 frontend type fix

on:
  push:
    branches: [phase-4-6]
    paths:
      - '.github/workflows/fix-phase46-ui-type.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-4-6
          fetch-depth: 0
      - name: Add explorer source metadata type
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/app/page.tsx')
          text = path.read_text()
          old = '  notes: string[];\n};\n\ntype ExplorerResult'
          new = '  notes: string[];\n  sources?: SourceReference[];\n};\n\ntype ExplorerResult'
          if old not in text:
              raise SystemExit('Expected ExplorerNode type block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          grep -q 'sources?: SourceReference\[\];' apps/web/app/page.tsx
          rm .github/workflows/fix-phase46-ui-type.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix explorer source metadata typing"
          git push origin HEAD:phase-4-6
