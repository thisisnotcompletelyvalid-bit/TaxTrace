name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -U pip
      - run: pip install -e '.[dev]'
      - run: ruff check src apps tests
      - run: python -m compileall -q src apps alembic
      - run: pytest
      - run: alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./ci-taxtrace.db

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: /api
          TAXTRACE_API_INTERNAL_URL: http://127.0.0.1:8000

  census-live-source-smoke:
    if: github.ref == 'refs/heads/data-overhaul-v1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -U pip
      - run: pip install -e '.[dev]'
      - name: Parse real Census 2022 government and finance bulk files
        run: |
          python - <<'PY'
          from itertools import islice
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from taxtrace.warehouse_v2.catalog import get_source
          from taxtrace.warehouse_v2.census import iter_government_units, inspect_finance_zip
          from taxtrace.warehouse_v2.download import stream_download

          with TemporaryDirectory() as tmp:
              root = Path(tmp)
              unit_source = get_source('census-government-units-2022')
              unit_path = root / 'govt_units_2022.ZIP'
              stream_download(unit_source.source_url or '', unit_path, overwrite=True)
              units = list(islice(iter_government_units(unit_path), 5000))
              assert len(units) == 5000, len(units)
              assert all(len(unit.government_id) >= 12 and unit.name for unit in units)
              assert len({unit.government_id for unit in units}) == len(units)

              finance_source = get_source('census-gov-finance-2022')
              finance_path = root / '2022_Individual_Unit_File.zip'
              stream_download(finance_source.source_url or '', finance_path, overwrite=True)
              stats = inspect_finance_zip(finance_path, max_records=250000)
              assert stats['records'] == 250000, stats
              assert stats['governments'] >= 500, stats
              assert stats['item_codes'] >= 50, stats
              print({'units_sampled': len(units), **stats})
          PY

  no-docker-e2e:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./e2e-taxtrace.db
      NEXT_PUBLIC_API_BASE_URL: /api
      TAXTRACE_API_INTERNAL_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -U pip
      - run: pip install -e '.[dev]'
      - name: Bootstrap backend from a non-root working directory
        working-directory: apps/web
        run: python -m taxtrace.dev_server --check-only
      - name: Start API from a non-root working directory
        working-directory: apps/web
        run: |
          python -m taxtrace.dev_server > /tmp/taxtrace-api.log 2>&1 &
          echo $! > /tmp/taxtrace-api.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/taxtrace-api.log
          exit 1
      - name: Exercise phases 4-9A API and browser CORS
        run: |
          python - <<'PY'
          import httpx

          base = "http://127.0.0.1:8000"
          health = httpx.get(f"{base}/health")
          health.raise_for_status()

          root = httpx.get(f"{base}/", follow_redirects=False)
          assert root.status_code in (302, 307), root
          assert root.headers["location"] == "/docs", root.headers

          status = httpx.get(f"{base}/v1/warehouse/status")
          status.raise_for_status()
          data = status.json()
          assert data["source_snapshots"] == 13, data
          assert data["spend_facts"] == 22, data
          assert data["agencies"] == 7, data
          assert data["treasury_aggregate_rows"] == 32, data
          assert data["awards"] == 2, data
          assert data["search_documents"] >= 40, data

          request = {
              "tax_year": 2026,
              "spending_fiscal_year": 2025,
              "filing_status": "single",
              "wage_income": "50000",
              "spouse_wage_income": "0",
              "qualifying_children_under_17": 0,
              "other_dependents": 0,
          }
          receipt = httpx.post(f"{base}/v1/receipt/federal", json=request)
          receipt.raise_for_status()
          body = receipt.json()
          assert body["total_allocable_taxes"] == "7645.00", body
          assert body["conservation_difference"] == "0.00", body

          local = httpx.post(
              f"{base}/v1/receipt/florida-gainesville",
              json={**request, "household_size": 1},
          )
          local.raise_for_status()
          local_body = local.json()
          model = local_body["sales_tax_model"]
          assert model["calculation_basis"] == "MODELED", model
          assert model["cex_quintile"] == "second", model
          assert model["florida_state_sales_tax"] == "791.35", model
          assert model["alachua_county_surtax"] == "197.84", model
          assert local_body["florida_state"]["conservation_difference"] == "0.00", local_body
          assert local_body["alachua_local"]["conservation_difference"] == "0.00", local_body
          assert local_body["gainesville_spending_reference"]["total_actual_expenditure"] == "185815738.00", local_body
          assert local_body["gainesville_spending_reference"]["attributable_tax_amount"] is None, local_body
          assert local_body["total_supported_calculated_and_modeled_tax"] == "8634.19", local_body

          explorer = httpx.post(
              f"{base}/v1/explorer/federal",
              json={
                  **request,
                  "view": "program_activity",
                  "parent_type": "federal_account",
                  "parent_key": "federal_account:012-3505",
              },
          )
          explorer.raise_for_status()
          detail = explorer.json()
          assert detail["scope_amount"] == "0.07", detail
          assert detail["conservation_difference"] == "0.00", detail

          search = httpx.get(f"{base}/v1/search", params={"q": "food stamps"})
          search.raise_for_status()
          results = search.json()["results"]
          assert results and results[0]["title"] == "Supplemental Nutrition Assistance Program", results
          assert all(result["additive"] is False for result in results), results

          cors = httpx.options(
              f"{base}/v1/receipt/federal",
              headers={
                  "Origin": "http://localhost:3000",
                  "Access-Control-Request-Method": "POST",
              },
          )
          cors.raise_for_status()
          assert cors.headers.get("access-control-allow-origin") == "http://localhost:3000", cors.headers
          PY
      - name: Build web app
        working-directory: apps/web
        run: |
          npm install
          npm run build
      - name: Start and smoke-test web app and API proxy
        working-directory: apps/web
        run: |
          npm run start -- -H 127.0.0.1 -p 3000 > /tmp/taxtrace-web.log 2>&1 &
          echo $! > /tmp/taxtrace-web.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000 > /tmp/taxtrace-home.html; then
              break
            fi
            sleep 1
          done
          if ! grep -q "public-finance path" /tmp/taxtrace-home.html; then
            cat /tmp/taxtrace-web.log
            exit 1
          fi
          curl -fsS http://127.0.0.1:3000/florida | grep -q "Florida and Gainesville"
          curl -fsS http://127.0.0.1:3000/api/health | grep -q '"status":"ok"'
          python - <<'PY'
          import httpx

          request = {
              "tax_year": 2026,
              "spending_fiscal_year": 2025,
              "filing_status": "single",
              "wage_income": "50000",
              "spouse_wage_income": "0",
              "qualifying_children_under_17": 0,
              "other_dependents": 0,
              "household_size": 1,
          }
          response = httpx.post("http://127.0.0.1:3000/api/v1/receipt/florida-gainesville", json=request)
          response.raise_for_status()
          body = response.json()
          assert body["federal"]["total_allocable_taxes"] == "7645.00", body
          assert body["sales_tax_model"]["combined_sales_tax"] == "989.19", body
          assert body["florida_state"]["conservation_difference"] == "0.00", body
          assert body["alachua_local"]["conservation_difference"] == "0.00", body
          PY
