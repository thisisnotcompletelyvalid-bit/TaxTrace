[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taxtrace"
version = "0.3.0"
description = "Auditable federal, Florida, and local tax-attribution and public-finance explorer."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "alembic>=1.13",
  "fastapi>=0.115",
  "httpx>=0.27",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy>=2.0",
  "typer>=0.12",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5",
  "ruff>=0.7",
]

[project.scripts]
taxtrace = "taxtrace.cli:app"
taxtrace-api = "taxtrace.dev_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
taxtrace = ["data/**/*.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F"]
ignore = ["E501"]
