services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taxtrace
      POSTGRES_USER: taxtrace
      POSTGRES_PASSWORD: taxtrace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxtrace -d taxtrace"]
      interval: 5s
      timeout: 5s
      retries: 20

  data-init:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://taxtrace:taxtrace@db:5432/taxtrace
      APP_ENV: production
      RAW_DATA_DIR: /app/data/raw
      WAREHOUSE_DATA_DIR: /app/data/warehouse
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && python -m taxtrace.warehouse_v2.product_activation"
      ]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://taxtrace:taxtrace@db:5432/taxtrace
      APP_ENV: production
      RAW_DATA_DIR: /app/data/raw
      WAREHOUSE_DATA_DIR: /app/data/warehouse
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      data-init:
        condition: service_completed_successfully
    command: ["sh", "-c", "alembic upgrade head && uvicorn apps.api.app.main:app --host 0.0.0.0 --port 8000"]

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
